workflows:
  handmade_egypt_android:
    name: Handmade Egypt - Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Create Flutter Android project
        script: |
          flutter create --platforms=android --project-name handmade_egypt .

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Build release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

name: handmade_egypt
description: Handmade Egypt - Egyptian handmade products marketplace.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png" # مسار صورة اللوجو الخاصة بك في مجلد assets

